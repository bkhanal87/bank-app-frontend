<div class="col-md-9">
    <div class="hstack">
        <div class="card">
            <div class="card-body">
                <h3>Delete User</h3>
            </div>
        </div>
    </div>

    <form (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="id">ID</label>
            <input
                type="text"
                class="form-control"
                id="id"
                [(ngModel)]="user.id"
                name="id"
                readonly>
        </div>

        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                class="form-control"
                id="name"
                [(ngModel)]="user.name"
                name="name"
                readonly>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input
                type="text"
                class="form-control"
                id="address"
                [(ngModel)]="user.address"
                name="address"
                readonly>
        </div>

        <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input
                type="text"
                class="form-control"
                id="phoneNumber"
                [(ngModel)]="user.phoneNumber"
                name="phoneNumber"
                readonly>
        </div>

        <br>

        <button type="submit" class="btn btn-danger">
            Delete User
        </button>
    </form>
</div>
